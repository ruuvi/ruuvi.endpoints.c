# Run SonarScanner

name: SonarCloud

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  sonar-scan:
    runs-on: ubuntu-latest

    env:
      BUILD_WRAPPER_OUT_DIR: bw-output

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Install build-wrapper
      uses: SonarSource/sonarqube-scan-action/install-build-wrapper@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1

    - name: Download Nordic SDK
      run: |
        if [ ! -d "nRF5_SDK_15.3.0_59ac345/modules" ]; then
          # Nordic SDK download redirects to CDN - allow limited redirects from trusted source
          wget -q --max-redirect=3 https://developer.nordicsemi.com/nRF5_SDK/nRF5_SDK_v15.x.x/nRF5_SDK_15.3.0_59ac345.zip
          unzip -q nRF5_SDK_15.3.0_59ac345.zip
        fi

    - name: Compile project
      run: |
        build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} \
          gcc -c src/*.c -I./nRF5_SDK_15.3.0_59ac345/components/libraries/util -I./src

    - name: Set up Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Install Ceedling and GCovr
      run: |
        gem install ceedling
        pip install gcovr

    - name: Run tests
      run: make test_all_gcov

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.organization=ruuvi
          -Dsonar.projectKey=ruuvi_ruuvi.endpoints.c
          -Dsonar.sources=./src
          -Dsonar.cfamily.build-wrapper-output=${{ env.BUILD_WRAPPER_OUT_DIR }}
          -Dsonar.cfamily.gcov.reportsPath=.
          -Dsonar.host.url=https://sonarcloud.io
